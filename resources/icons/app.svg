  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C98A3E"/><stop offset="0.5" stop-color="#E9B567"/><stop offset="1" stop-color="#9C6424"/>
  </linearGradient>
</defs>

