[pytest]
testpaths = tests
pythonpath = .
# Kodlamasız open/write_text yerel ayara bağlıdır (Türkçe Windows cp1254, GitHub runner cp1252): CI'da
# PYTHONWARNDEFAULTENCODING=1 ile uyarı üretilir ve burada hataya çevrilir. Yerelde: python -X warn_default_encoding -m pytest
filterwarnings =
    error::EncodingWarning
